<!-- Marchio Runway Surfer: una pista che si incurva in un'onda, su una lastra di
     vetro squircle. UNICA fonte del glifo, usata da tre superfici:
       - sidebar (header ~22px, launcher ~26px) → shared/logo.ts, via ?raw
       - banner del tour nel DOM host (~24px)   → shared/logo.ts, via ?raw
       - header della dashboard (~30px)         → server/src/views/shared-assets.ts, letto da disco
     Nessun asset esterno e nessun font: la CSP di una pagina host arbitraria
     bloccherebbe un file remoto, quindi il glifo viaggia inline.
     Le dimensioni le decide il contenitore (width/height 100%); i tratti restano
     sopra 1.6 unità su una viewBox 32 per reggere anche a 20px. -->
<svg viewBox="0 0 32 32" width="100%" height="100%" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rs-logo-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000099" />
      <stop offset="1" stop-color="#1668e3" />
    </linearGradient>
    <linearGradient id="rs-logo-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="rs-logo-clip">
      <rect x="1" y="1" width="30" height="30" rx="9" />
    </clipPath>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#rs-logo-plate)" />
  <g clip-path="url(#rs-logo-clip)">
    <rect x="1" y="1" width="30" height="15" fill="url(#rs-logo-sheen)" />
    <path
      d="M3 25.5c4.2 0 6.6-1.6 9.2-5.1C15.3 16.2 18.7 8 27.5 8"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <path
      d="M6 25.5h3.4M13.2 22.6h2.9M18.6 16.4h2.7M23.7 10.6h2.6"
      stroke="#ffcc00"
      stroke-width="1.9"
      stroke-linecap="round"
    />
  </g>
  <rect
    x="1.6"
    y="1.6"
    width="28.8"
    height="28.8"
    rx="8.4"
    stroke="#ffffff"
    stroke-opacity="0.55"
    stroke-width="1.2"
  />
</svg>
