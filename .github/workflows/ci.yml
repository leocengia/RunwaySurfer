name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: Estensione (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  server:
    name: Backend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run build
