name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: Estensione (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Il pacchetto del pilota deve essere tracciabile a un commit, non
      # costruito a mano su un portatile: da qui si scarica lo zip da installare.
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: runway-surfer-extension
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 30

  server:
    name: Backend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run build
